<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Tesla Clone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar scrolled" id="navbar">
    <a href="/" class="nav-logo">
      <svg viewBox="0 0 342 35" xmlns="http://www.w3.org/2000/svg"><path d="M0 .1a9.7 9.7 0 007 7h11l.5.1v27.6h6.8V7.3L26 7h11a9.8 9.8 0 007-7H0zm238.6 0h-6.8v34.8H263a9.7 9.7 0 006-6.8h-30.3V0zm-52.3 6.8c3.6-1 6.6-3.8 7.4-6.9l-38.1.1v20.6h31.1v7.2h-24.4a13.6 13.6 0 00-8.7 7h39.9v-21h-31.2v-7zm116.2 28h6.7v-14h24.6v14h6.7v-21h-38zM85.3 7h26a9.6 9.6 0 007.1-7H78.3a9.6 9.6 0 007 7m0 13.8h26a9.6 9.6 0 007.1-7H78.3a9.6 9.6 0 007 7m0 14.1h26a9.6 9.6 0 007.1-7H78.3a9.6 9.6 0 007 7M308.5 7h26a9.6 9.6 0 007-7h-40a9.6 9.6 0 007 7" fill="currentColor"/></svg>
    </a>
    <div class="nav-links">
      <a href="/cars">Vehicles</a>
      <a href="/customize">Customize</a>
      <a href="#">Energy</a>
      <a href="#">Charging</a>
    </div>
    <div class="nav-auth" id="navAuth">
      <a href="/login">Sign In</a>
      <a href="/signup">Sign Up</a>
    </div>
    <button class="mobile-menu-btn" id="mobileMenuBtn">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile Navigation -->
  <div class="mobile-nav" id="mobileNav">
    <a href="/">Home</a>
    <a href="/cars">Vehicles</a>
    <a href="/customize">Customize</a>
    <a href="#">Energy</a>
    <a href="#">Charging</a>
    <a href="/login">Sign In</a>
    <a href="/signup">Sign Up</a>
  </div>
  <div class="overlay" id="overlay"></div>

  <!-- Login Page -->
  <main class="auth-page">
    <div class="auth-container">
      <h1>Sign In</h1>
      <p class="subtitle">Access your Tesla Account</p>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="email@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="auth-btn" id="submitBtn">Sign In</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/signup">Create Account</a></p>
      </div>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
